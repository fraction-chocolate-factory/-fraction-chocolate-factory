<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>کارخانه شکلات‌سازی کسرها | مهدی نارویی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --choc-dark: #4e342e;
    --choc-main: #5d4037;
    --choc-light: #8d6e63;
    --gold: #ffb300;
    --bg-color: #fff8e1;
    --text-color: #3e2723;
    --wrong: #e53935;
    --correct: #43a047;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; user-select: none; }
  
  body {
    background: linear-gradient(135deg, #ffcc80, #ffb74d, #ffa726);
    background-size: 200% 200%;
    animation: bgMove 10s ease infinite;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 15px;
    overflow: hidden;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .game-container {
    background: rgba(255, 255, 255, 0.95);
    width: 100%;
    max-width: 650px;
    border-radius: 30px;
    box-shadow: 0 20px 50px rgba(121, 85, 72, 0.4), inset 0 0 0 4px var(--gold);
    padding: 25px;
    text-align: center;
    position: relative;
    backdrop-filter: blur(10px);
  }

  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 3px dashed #ffcc80;
  }

  .title-area { text-align: right; }
  .title { font-size: 1.6rem; font-weight: 900; color: var(--text-color); display: flex; align-items: center; gap: 8px; }
  
  .designer {
    font-size: 0.9rem;
    color: #fff;
    background: var(--choc-light);
    padding: 5px 15px;
    border-radius: 20px;
    display: inline-block;
    margin-top: 8px;
    font-weight: bold;
    box-shadow: 0 4px 0 var(--choc-dark);
  }

  .score-badge {
    background: linear-gradient(135deg, #ffca28, #ff8f00);
    color: #fff;
    padding: 10px 20px;
    border-radius: 25px;
    font-size: 1.3rem;
    font-weight: 900;
    box-shadow: 0 6px 0 #e65100, 0 10px 20px rgba(255, 143, 0, 0.4);
    transition: transform 0.2s;
  }
  .score-badge.pop { animation: popScore 0.4s ease; }

  @keyframes popScore {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.3) rotate(5deg); }
  }

  /* استایل کسرها */
  .math-expression {
    font-size: 2.8rem;
    font-weight: 900;
    color: var(--choc-main);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 15px;
    margin: 20px 0;
    direction: ltr;
    text-shadow: 2px 2px 0px #ffe0b2;
  }
  
  .fraction { display: inline-flex; flex-direction: column; align-items: center; font-size: 2.2rem; }
  .fraction .num { border-bottom: 5px solid var(--choc-main); padding: 0 8px; line-height: 1.1; }
  .fraction .den { padding: 0 8px; line-height: 1.1; }

  /* استایل شکلات‌ها */
  .visuals-container {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin: 25px 0;
    padding: 20px;
    background: #efebe9;
    border-radius: 20px;
    border: 3px solid #d7ccc8;
    box-shadow: inset 0 5px 15px rgba(0,0,0,0.05);
  }

  .shape-group { display: flex; align-items: center; gap: 8px; }
  
  .chocolate-bar {
    display: flex;
    border: 4px solid var(--choc-dark);
    border-radius: 10px;
    overflow: hidden;
    height: 45px;
    width: 130px;
    background: #fff;
    box-shadow: 0 6px 10px rgba(0,0,0,0.15);
  }
  
  .choc-piece {
    flex: 1;
    border-right: 3px solid var(--choc-dark);
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    background: #fafafa;
  }
  .choc-piece:last-child { border-right: none; }
  .choc-piece.filled {
    background: linear-gradient(135deg, var(--choc-light), var(--choc-dark));
    box-shadow: inset 2px 2px 4px rgba(255,255,255,0.2);
  }

  .plus-sign { font-size: 2rem; font-weight: 900; color: #ff9800; text-shadow: 1px 1px 0 #e65100; }

  /* دکمه‌های گزینه‌ها */
  .options-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 25px;
  }

  .option-btn {
    background: linear-gradient(135deg, #fff3e0, #ffe0b2);
    border: 3px solid #ffb74d;
    border-radius: 20px;
    padding: 12px;
    font-size: 2rem;
    font-weight: 900;
    color: var(--choc-main);
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    justify-content: center;
    align-items: center;
    box-shadow: 0 8px 0 #f57c00, 0 15px 20px rgba(245, 124, 0, 0.2);
    position: relative;
    overflow: hidden;
  }

  .option-btn:hover {
    transform: translateY(-4px);
    background: linear-gradient(135deg, #ffe0b2, #ffcc80);
    box-shadow: 0 12px 0 #f57c00, 0 20px 25px rgba(245, 124, 0, 0.3);
  }

  .option-btn:active {
    transform: translateY(6px);
    box-shadow: 0 2px 0 #f57c00;
  }

  .option-btn.correct {
    background: linear-gradient(135deg, #81c784, #43a047);
    border-color: #1b5e20;
    color: #fff;
    box-shadow: 0 8px 0 #2e7d32;
  }
  .option-btn.correct .fraction .num { border-color: #fff; }

  .option-btn.wrong {
    background: linear-gradient(135deg, #e57373, #e53935);
    border-color: #b71c1c;
    color: #fff;
    box-shadow: 0 8px 0 #c62828;
    animation: shake 0.4s ease;
  }
  .option-btn.wrong .fraction .num { border-color: #fff; }

  .feedback {
    min-height: 50px;
    margin-top: 20px;
    font-size: 1.4rem;
    font-weight: 900;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 15px;
    padding: 5px;
    transition: all 0.3s;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px) rotate(-2deg); }
    75% { transform: translateX(10px) rotate(2deg); }
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    80% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }
  
  .animate-pop { animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

  /* افکت ستاره‌ها و ذرات */
  .particle {
    position: fixed;
    pointer-events: none;
    font-size: 28px;
    z-index: 999;
    animation: burst 1s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
  }
  @keyframes burst {
    0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) scale(1.5) rotate(360deg); opacity: 0; }
  }
</style>
</head>
<body>

<div class="game-container animate-pop">
  <div class="header">
    <div class="title-area">
      <div class="title">🏭 کارخانه شکلات‌سازی کسرها 🍫</div>
      <div class="designer">👨‍💻 طراح: مهدی نارویی</div>
    </div>
    <div class="score-badge" id="scoreDisplay">⭐ ۰</div>
  </div>

  <div id="gameScreen">
    <div class="math-expression" id="expression">
      <!-- توسط جاوااسکریپت پر می‌شود -->
    </div>
    
    <div class="visuals-container" id="visuals">
      <!-- شکلات‌ها اینجا کشیده می‌شوند -->
    </div>

    <div class="options-grid" id="options">
      <!-- گزینه‌ها -->
    </div>
    
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
  // تبدیل اعداد انگلیسی به فارسی برای نمایش
  const faNum = n => String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  
  let score = 0;
  let currentCorrectAnswer = {};
  
  // سیستم صوتی (مشابه بازی قبلی)
  let audioCtx = null;
  function initAudio() {
    if (!audioCtx) {
      try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
    }
  }
  
  function beep(freq, dur = 0.15, type = 'sine', vol = 0.15) {
    if (!audioCtx) return;
    try {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq;
      g.gain.setValueAtTime(vol, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch(e) {}
  }
  
  function soundClick() { beep(500, 0.08, 'square', 0.1); }
  function soundCorrect() { beep(660, 0.12); setTimeout(() => beep(880, 0.15), 120); setTimeout(() => beep(1100, 0.22), 260); }
  function soundWrong() { beep(220, 0.18, 'sawtooth'); setTimeout(() => beep(160, 0.25, 'sawtooth'), 150); }

  // افکت بارش ستاره و شکلات
  function burst(x, y, emojis) {
    for (let i = 0; i < 15; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      p.style.left = x + 'px';
      p.style.top = y + 'px';
      const ang = Math.random() * Math.PI * 2;
      const dist = 60 + Math.random() * 120;
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1000);
    }
  }

  function generateQuestion() {
    // تولید اعداد تصادفی
    const wholeNumber = Math.floor(Math.random() * 4) + 2; // بین 2 تا 5
    const denominator = Math.floor(Math.random() * 4) + 3; // بین 3 تا 6
    const numerator = Math.floor(Math.random() * (denominator - 1)) + 1; // کوچکتر از مخرج

    currentCorrectAnswer = { num: wholeNumber * numerator, den: denominator };

    renderMathExpression(wholeNumber, numerator, denominator);
    renderVisuals(wholeNumber, numerator, denominator);
    generateOptions(wholeNumber, numerator, denominator);
    
    const fb = document.getElementById('feedback');
    fb.innerHTML = 'بسته‌های شکلات رو جمع بزن! 😋';
    fb.style.color = 'var(--choc-light)';
    fb.style.background = 'transparent';
  }

  function renderMathExpression(w, n, d) {
    const expr = document.getElementById('expression');
    expr.innerHTML = `
      <span>${faNum(w)}</span>
      <span>&times;</span>
      <div class="fraction">
        <span class="num">${faNum(n)}</span>
        <span class="den">${faNum(d)}</span>
      </div>
      <span>=</span>
      <span>؟</span>
    `;
  }

  function renderVisuals(w, n, d) {
    const container = document.getElementById('visuals');
    let html = '';
    
    for(let i = 0; i < w; i++) {
      html += `<div class="shape-group animate-pop" style="animation-delay: ${i*0.1}s">`;
      html += `<div class="chocolate-bar">`;
      for(let j = 0; j < d; j++) {
        const isFilled = j < n ? 'filled' : '';
        html += `<div class="choc-piece ${isFilled}"></div>`;
      }
      html += `</div>`;
      if (i < w - 1) html += `<span class="plus-sign">+</span>`;
      html += `</div>`;
    }
    container.innerHTML = html;
  }

  function generateOptions(w, n, d) {
    const correct = currentCorrectAnswer;
    const options = [
      correct,
      { num: w + n, den: d },
      { num: w * n, den: w * d },
      { num: n, den: d + w }
    ];

    let uniqueOptions = [];
    let map = new Map();
    for(let opt of options) {
      let key = opt.num + '/' + opt.den;
      if(!map.has(key)) { map.set(key, true); uniqueOptions.push(opt); }
    }
    
    while(uniqueOptions.length < 4) {
      let rNum = Math.floor(Math.random() * 15) + 1;
      let rDen = d;
      let key = rNum + '/' + rDen;
      if(!map.has(key)) { map.set(key, true); uniqueOptions.push({num: rNum, den: rDen}); }
    }

    uniqueOptions.sort(() => Math.random() - 0.5);

    const optionsContainer = document.getElementById('options');
    optionsContainer.innerHTML = '';

    uniqueOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn animate-pop';
      btn.innerHTML = `
        <div class="fraction">
          <span class="num">${faNum(opt.num)}</span>
          <span class="den">${faNum(opt.den)}</span>
        </div>
      `;
      
      btn.onclick = (e) => checkAnswer(opt, btn, e);
      optionsContainer.appendChild(btn);
    });
  }

  function checkAnswer(selected, btnElement, event) {
    initAudio();
    const allBtns = document.querySelectorAll('.option-btn');
    allBtns.forEach(b => b.style.pointerEvents = 'none');

    const feedback = document.getElementById('feedback');

    if (selected.num === currentCorrectAnswer.num && selected.den === currentCorrectAnswer.den) {
      // جواب درست
      soundCorrect();
      btnElement.classList.add('correct');
      score++;
      
      const sb = document.getElementById('scoreDisplay');
      sb.textContent = `⭐ ${faNum(score)}`;
      sb.classList.remove('pop');
      void sb.offsetWidth; // ری‌استارت انیمیشن
      sb.classList.add('pop');

      feedback.innerHTML = '🎉 عالی! شکلات‌ها بسته‌بندی شدن! 🍫';
      feedback.style.color = '#1b5e20';
      feedback.style.background = '#c8e6c9';
      
      // افکت ریختن شکلات از محل کلیک
      const rect = btnElement.getBoundingClientRect();
      burst(rect.left + rect.width / 2, rect.top + rect.height / 2, ['🍫', '⭐', '✨', '😋']);
      
      setTimeout(generateQuestion, 1600);
      
    } else {
      // جواب اشتباه
      soundWrong();
      btnElement.classList.add('wrong');
      feedback.innerHTML = '❌ ای وای! دوباره بشمار...';
      feedback.style.color = '#b71c1c';
      feedback.style.background = '#ffcdd2';
      
      allBtns.forEach(b => {
        const nText = b.querySelector('.num').textContent;
        if(nText === faNum(currentCorrectAnswer.num)) {
          b.classList.add('correct');
        }
      });

      setTimeout(generateQuestion, 2500);
    }
  }

  // اضافه کردن صدای کلیک به دکمه‌ها
  document.addEventListener('mousedown', () => { initAudio(); });
  
  window.onload = generateQuestion;
</script>
</body>
</html>
